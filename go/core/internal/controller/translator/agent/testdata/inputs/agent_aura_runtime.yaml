operation: translateAgent
targetObject: aura-agent
namespace: test
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: openai-secret
      namespace: test
    data:
      api-key: c2stdGVzdC1hcGkta2V5  # base64 encoded "sk-test-api-key"
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: test-model
      namespace: test
    spec:
      provider: OpenAI
      model: gpt-4o
      apiKeySecret: openai-secret
      apiKeySecretKey: api-key
  - apiVersion: kagent.dev/v1alpha2
    kind: Agent
    metadata:
      name: aura-agent
      namespace: test
    spec:
      type: Declarative
      declarative:
        runtime: aura
        description: An agent running on Mezmo AURA
        systemMessage: You are an SRE assistant. Investigate alerts and surface root cause.
        modelConfig: test-model
        tools:
          - type: McpServer
            mcpServer:
              name: mezmo-telemetry
              kind: RemoteMCPServer
              apiGroup: kagent.dev
  - apiVersion: kagent.dev/v1alpha2
    kind: RemoteMCPServer
    metadata:
      name: mezmo-telemetry
      namespace: test
    spec:
      url: http://mcp-server.test:8080/mcp
      description: "Mezmo telemetry MCP server"
      protocol: STREAMABLE_HTTP
